project:
  type: book
  output-dir: _site
  resources:
    - cs1100-cse-iitm-2021/slides/
    - materials/
    - notebooks/
    - labs/
    - "!private/**"
    - "!private/"

book:
  title: "CS-1-01 (MO)"
  subtitle: "Computer System and Programming · Monsoon 2026"
  author: "Soma S Dhavala · IIT Jammu"
  reader-mode: true
  sidebar:
    collapse-level: 1

  page-footer:
    left: |
      CS-1-01 (MO) · Computer System and Programming · Monsoon 2026 (2026-01) · IIT Jammu
    right: |
      Built with <a href="https://quarto.org/">Quarto</a>.

  site-url: https://acads-iit-jammu.github.io/csp-f26-dhavala
  repo-url: https://github.com/acads-iit-jammu/csp-f26-dhavala
  repo-branch: main

  chapters:
    - index.qmd
    - course.qmd
    - syllabus.qmd
    - labs.qmd
    - part: "Weekly Notes"
      chapters:
        - weeks/w01.qmd
        - weeks/w02.qmd
        - weeks/w03.qmd
        - weeks/w04.qmd
        - weeks/w05.qmd
        - weeks/w06.qmd
        - weeks/w07.qmd
        - weeks/w08.qmd
        - weeks/w09.qmd
        - weeks/w10.qmd
        - weeks/w11.qmd
        - weeks/w12.qmd
        - weeks/w13.qmd
        - weeks/w14.qmd
        - weeks/w15.qmd
        - weeks/w16.qmd
        - weeks/mu1.qmd
        - weeks/mu2.qmd
    - part: "Lab Sheets"
      chapters:
        - labsheets/lab01.qmd
        - labsheets/lab02.qmd
        - labsheets/lab03.qmd
        - labsheets/lab04.qmd
        - labsheets/lab05.qmd
        - labsheets/lab06.qmd
        - labsheets/lab07.qmd
        - labsheets/lab08.qmd
        - labsheets/lab09.qmd
        - labsheets/lab10.qmd
        - labsheets/lab11.qmd
        - labsheets/lab12.qmd
        # lab13.qmd unlisted: holidays leave 12 lab sessions, not 13.
        # The file is kept on disk — re-add this line if a 13th slot appears.
    - part: "Materials & Notebooks"
      chapters:
        - materials/index.qmd
        - notebooks/index.qmd
    - part: "Reference Material"
      chapters:
        - cs1100-cse-iitm-2021/index.qmd
        - resources.qmd

format:
  html:
    code-copy: true
    theme:
      - cosmo
      - iitjammu.scss
    callout-appearance: simple
    number-sections: false
    link-external-newwindow: true

editor: source

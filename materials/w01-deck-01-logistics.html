<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck 1 · Logistics · CS-1-01 (MO)</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Slab:wght@400;600;700&family=Roboto+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#003f87; --blue-dark:#002d63; --blue-mid:#0056b8; --blue-sky:#4da3ff; --blue-pale:#eaf3ff;
    --ink:#22262a; --star:#f4b400;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0b1e3a;font-family:Roboto,system-ui,sans-serif;color:var(--ink)}
  #root{height:100%}
  .deck{height:100%;display:flex;flex-direction:column;overflow:hidden}
  .slide{flex:1;display:flex;flex-direction:column;justify-content:center;padding:5vh 8vw;
         background:#fff;overflow:auto}
  .slide.title{background:linear-gradient(160deg,var(--blue-dark) 0%,var(--blue) 70%,var(--blue-mid) 100%);color:#fff}
  .slide.accent{background:linear-gradient(160deg,#f6faff,var(--blue-pale))}
  h1{font-family:"Roboto Slab",serif;font-size:clamp(1.8rem,4.5vw,3.2rem);margin:.2em 0;line-height:1.15}
  h2{font-family:"Roboto Slab",serif;font-size:clamp(1.4rem,3vw,2.2rem);color:var(--blue-dark);margin:.2em 0 .6em;
     border-bottom:3px solid var(--blue-pale);padding-bottom:.25em}
  .title h2{color:#cfe3ff;border:none;font-weight:400;font-size:clamp(1rem,2vw,1.5rem)}
  .kicker{font-size:clamp(.8rem,1.4vw,1rem);letter-spacing:.14em;text-transform:uppercase;color:var(--blue-sky)}
  p,li{font-size:clamp(1rem,1.9vw,1.35rem);line-height:1.55}
  li{margin:.35em 0}
  .big{font-size:clamp(1.3rem,2.6vw,1.9rem);font-weight:500;color:var(--blue-dark)}
  table{border-collapse:collapse;font-size:clamp(.95rem,1.7vw,1.25rem);margin:.4em 0;width:100%}
  th{background:var(--blue);color:#fff;text-align:left}
  th,td{border:1px solid #cfdcec;padding:.35em .7em}
  tr:nth-child(even) td{background:#f4f8fd}
  code,.mono{font-family:"Roboto Mono",monospace;color:var(--blue-mid)}
  .cols{display:flex;gap:4vw;flex-wrap:wrap}
  .cols>div{flex:1;min-width:260px}
  .note{background:var(--blue-pale);border-left:5px solid var(--blue);padding:.5em 1em;border-radius:0 8px 8px 0;
        font-size:clamp(.95rem,1.7vw,1.2rem)}
  .quote{font-family:"Roboto Slab",serif;font-size:clamp(1.4rem,3.4vw,2.4rem);color:var(--blue-dark);
         text-align:center;line-height:1.4;margin:auto 0}
  .quote small{display:block;font-family:Roboto,sans-serif;font-size:.55em;color:#667;margin-top:1em}
  /* chrome */
  .bar{height:5px;background:#12305c}
  .bar>div{height:100%;background:var(--blue-sky);transition:width .25s}
  .foot{display:flex;justify-content:space-between;align-items:center;background:#0b1e3a;color:#8fb4e8;
        font-size:.75rem;padding:6px 14px;font-family:"Roboto Mono",monospace}
  .foot b{color:#cfe3ff;font-weight:500}
  .navhint{opacity:.7}
  .clickzone{position:fixed;top:0;bottom:30px;width:18vw;cursor:pointer;z-index:5}
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";
const e = React.createElement;
const F = React.Fragment;

/* ---------- content ---------- */
const li = (...items)=> e("ul",null, ...items.map(t=> e("li",{dangerouslySetInnerHTML:{__html:t}})));
const html = (tag,s)=> e(tag,{dangerouslySetInnerHTML:{__html:s}});
const table = (head,rows)=> e("table",null,
  e("thead",null, e("tr",null, ...head.map(hh=>e("th",null,hh)))),
  e("tbody",null, ...rows.map(r=> e("tr",null, ...r.map(c=> html("td",c))))));

const SLIDES = [
{cls:"title", body:()=> e(F,null,
  e("div",{className:"kicker"},"CS-1-01 (MO) · EFL001U1M · Monsoon 2026 · IIT Jammu"),
  e("h1",null,"Computer System and Programming"),
  e("h2",null,"Deck 1 — how this course works"),
  e("p",{style:{marginTop:"2em",color:"#cfe3ff"}},"Soma S Dhavala · Electrical / Mechanical / Materials sections"),
  e("p",{style:{color:"#8fb4e8",fontSize:"1rem"}},"→ arrow keys or click the right edge to advance"))},

{title:"Hello — and one sentence to keep", body:()=> e(F,null,
  e("div",{className:"quote"},"“The computer is cheap.",e("br"),"The plan is not.”",
    e("small",null,"This course teaches you to make plans so precise that anything — you, a classmate, a machine — can carry them out, and so clear that you can tell whether it did.")))},

{title:"Who & where", body:()=> e(F,null,
  table(["","Details"],[
    ["<b>Instructor (these sections)</b>","Soma S Dhavala — Electrical, Mechanical, Materials"],
    ["<b>Lectures</b>","Monday &amp; Tuesday, 8:00–8:50 am · <b>12LH3004</b>"],
    ["<b>Lab — Electrical</b>","Tuesday 2:00–4:00 pm"],
    ["<b>Lab — Mechanical &amp; Materials</b>","Wednesday 2:00–4:00 pm"],
    ["<b>Other sections</b>","Aroof Aimen (Civil, CS, BS) · Sarada Prasad Gochhayat (Chemical, M&amp;C, Eng. Physics)"]]),
  html("p",'Everything lives on the course site: <code>acads-iit-jammu.github.io/csp-f26-dhavala</code>'))},

{title:"What this course actually is", body:()=> e(F,null,
  li("<b>Officially:</b> C programming — variables, loops, arrays, pointers, functions, files (2-0-2: two lecture hours + one two-hour lab, every week)",
     "<b>Actually:</b> disciplined <b>problem solving</b>, made precise enough to be executed and checked",
     "C is our medium; the skills — specify, plan, implement, verify — outlive any language",
     "<b>A caution, though:</b> “it's not about the language” is no excuse to stay shallow in it. The deeper you understand your language — its types, its memory, its edges — the better the programs you can write <i>and judge</i>. Mastery of the medium is part of the craft",
     "In the age of AI code assistants, the scarce skill is not <i>typing</i> programs — it is <b>stating problems precisely</b> and <b>judging whether code is correct</b>"))},

{title:"Programming is not about computers", body:()=> e(F,null,
  html("p",'<span class="big">“Computer science is not about machines, in the same way that astronomy is not about telescopes.”</span> <span style="color:#667;font-size:.8em">— Michael Fellows (with Ian Parberry), early 1990s. The internet says Dijkstra; we checked — it isn\'t. See this week\'s PAGAL note.</span>'),
  li("You have computed all your life <i>without</i> a computer: long division, scaling a recipe for 7 guests, finding a name in a sorted attendance register",
     "<b>Computing</b> is the method — a step-by-step plan that turns what you have into what you want",
     "<b>Programming</b> is writing that plan precisely enough for the most obedient, most literal-minded executor ever built",
     "The full chain is: <b>world → problem → plan → notation → executor</b>. The computer is the last box and the most replaceable; the <b>world</b> is the first box — and the deep one. Problems belong to someone, somewhere"),
  html("div",'<div class="note">So when you are stuck this semester, the question is almost never “what C should I type?” — it is “<b>what is my plan?</b>”</div>'))},

{title:"…so what IS programming about?", body:()=> e(F,null,
  html("p",'<span class="big">Programming is a means of solving problems by computation.</span>'),
  table(["The four verbs (you will do these every week)","In plain words"],[
    ["<b>1 · Specify</b>","say exactly what is <i>given</i> and what must be <i>ensured</i> — until no ambiguity survives"],
    ["<b>2 · Plan</b>","break the problem down; pick a strategy; know <i>why</i> it will work"],
    ["<b>3 · Express</b>","write the plan in a notation an executor can follow — this semester, C"],
    ["<b>4 · Verify</b>","check what came out against what was promised — with test cases that could prove you wrong"]]),
  li("Underneath the verbs, three habits of mind: <b>decomposition</b> (big → small), <b>abstraction</b> (name it, hide the details, reuse it), and <b>precision</b> (the executor grants no benefit of the doubt)"),
  html("div",'<div class="note">The program is the <i>byproduct</i>. The understanding — problem, plan, and proof that it worked — is the <b>product</b>. And above the four verbs, one compass: <b>programming is about the world you are programming for — whose problem you are solving.</b> The spec is a model of <i>their</i> world, not yours.</div>'))},

{title:"Our pedagogy: the problem-solving spine", body:()=> e(F,null,
  html("p",'<span class="big">Programming is, fundamentally, problem solving.</span> The language is the easy part; the problem is the hard part — so the problem gets the attention.'),
  li("First move, always: <b>question the problem</b>. Ask. Clarify. Push back. <i>“The best solution is no solution at all”</i> — many problems shrink, split, or simply dissolve when stated properly. What survives the questioning <b>is</b> your specification",
     "<b>Pólya, <i>How to Solve It</i></b> (1945) gives us the loop we run on every problem: <b>understand → plan → carry out → look back</b> — you met it as Specify · Plan · Express · Verify",
     "<b>Engel, <i>Problem-Solving Strategies</i></b> gives us the moves inside the plan: invariants, working backwards, the extremal principle, case analysis — each will be <i>named</i> when we first use it",
     "You will meet both as weekly habits, not as homework — every worked example, lab sheet, and exam question runs on this spine"),
  html("div",'<div class="note">When you are stuck this semester, we will not ask “what code have you written?” We will ask: <b>“what is the problem, and what have you tried?”</b> — Pólya\'s question, and now ours.</div>'))},

{title:"Reading beats writing (yes, really)", body:()=> e(F,null,
  li("Professional programmers <b>read</b> roughly ten times more code than they write — old code, teammates' code, and now, AI's code",
     "Reading is the <b>auditing</b> skill: predict the output, spot the bug, check the program against what was <i>asked</i>",
     "It is in your official outcomes — and on your exams: <i>“explain the output of a given C program; identify and correct the errors”</i>",
     "Writing teaches you to <i>speak</i> C. Reading teaches you to <i>think</i> in it",
     "So expect reading drills all semester: predict-before-run, find-the-bug, and “show me an input that breaks it”"),
  html("div",'<div class="note">You wouldn\'t trust a writer who never reads. The same holds for programmers — especially ones whose AI writes the first draft.</div>'))},

{title:"The rhythm of every week", body:()=> e(F,null,
  table(["When","What"],[
    ["Mon &amp; Tue 8:00","Lecture — one new idea, worked through problems"],
    ["Tue / Wed 2:00","Lab — you program; lab sheets are self-contained"],
    ["On the site, weekly","Pre-read → In-Class materials → After-Class practice → <b>PAGAL notes</b> (an informal column: this week's ideas in the age of AI)"]]),
  html("div",'<div class="note">Habit to form <b>this week</b>: check the week page <i>before</i> Monday\'s lecture.</div>'))},

{title:"Assessment — where your grade comes from", body:()=> e(F,null,
  table(["Component","Weight"],[
    ["Class Test-1 (window: Aug 19–25)","10%"],
    ["Class Test-2 (window: Oct 14–22)","10%"],
    ["Mid-Semester Examination (Sep 18–23)","20%"],
    ["End-Semester Examination (Nov 23–30)","30%"],
    ["Hackathon (details announced soon)","10%"],
    ["Regular lab evaluation","20%"]]),
  html("p","Labs: <b>Lab 1 is not graded</b> (setup); from Lab 2 on, every lab counts equally toward the 20%."))},

{title:"Dates that matter", body:()=> e(F,null,
  li("<b>Aug 3</b> — classes begin (that's now!)",
     "<b>Aug 4 / Aug 5</b> — your first lab (EE Tue · Mech &amp; MT Wed): setup, not graded",
     "<b>Sep 18–23</b> — mid-semester examinations",
     "<b>Nov 20</b> — last day of classes",
     "<b>Nov 23–30</b> — end-semester examinations"),
  html("p",'Holidays that eat our slots (Dussehra, Diwali cluster, …) are all on the <b>Course page</b> — two make-up classes are already scheduled into the plan.'))},

{title:"Books & tools (all free or in the library)", body:()=> e(F,null,
  li("<b>Kernighan &amp; Ritchie</b>, <i>The C Programming Language</i>, 2e — <i>the</i> book",
     "MIT OCW <b>6.087 Practical Programming in C</b> — lectures, labs, and problems, free online",
     "CS1100 lecture slides (IIT Madras) — mirrored on our site, used with gratitude",
     "<b>OnlineGDB</b> — write and run C in your browser, zero installation",
     "<b>C Tutor</b> (pythontutor.com) — watch your program execute step by step"))},

{title:"This week: no C at all 🐢", body:()=> e(F,null,
  li("We start with <b>The Turtle Computer</b> — a programming language with ten words and no typing (it's on the site, Week 01)",
     "Six missions; new words get <i>invented</i> when a problem demands them — that is how real languages grew",
     "Then <b>the Toy Computer</b> and <b>Under the Hood</b>: what a computer really is, from switches up",
     "<b>Your job before Lab 1:</b> finish the six Turtle missions. Chase the two-star <i>par</i> scores."),
  html("div",'<div class="note">The turtle\'s lesson, which will follow you all semester: the machine does exactly what you <b>said</b> — never what you <b>meant</b>.</div>'))},

{title:"How to do well (the honest version)", body:()=> e(F,null,
  li("<b>Attend labs and do them yourself.</b> 20% of the grade, and the only place skill actually forms",
     "<b>Predict before you run.</b> Guessing-and-compiling teaches nothing; predicting trains the model in your head",
     "<b>State the problem before coding</b> — inputs, outputs, edge cases. Half of every exam question is exactly this",
     "70% of your grade (tests + exams) is closed-book, pen on paper — practice <i>writing</i> C by hand",
     "Ask early. In lecture, in lab, after class — confusion compounds weekly if unpaid"))},

{cls:"accent", title:"Next lecture", body:()=> e(F,null,
  e("div",{className:"quote"},"Tomorrow, 8:00 am:",e("br"),"What is a computer, really?",
    e("small",null,"Pre-read for the week is on the site tonight. Bring one question about the Turtle.")))},
];

/* ---------- deck engine ---------- */
function Deck(){
  const [i,setI] = React.useState(()=>{
    const n=parseInt(location.hash.slice(1)); return Number.isInteger(n)&&n>=0&&n<SLIDES.length? n:0; });
  const go = React.useCallback(d=>{
    setI(cur=>{ const n=Math.min(SLIDES.length-1, Math.max(0, cur+d)); location.hash="#"+n; return n; });
  },[]);
  React.useEffect(()=>{
    const k=ev=>{ if(["ArrowRight","PageDown"," "].includes(ev.key)) go(1);
                  else if(["ArrowLeft","PageUp"].includes(ev.key)) go(-1);
                  else if(ev.key==="Home"){ setI(0); location.hash="#0"; } };
    window.addEventListener("keydown",k); return ()=>window.removeEventListener("keydown",k);
  },[go]);
  const s=SLIDES[i];
  return e("div",{className:"deck"},
    e("div",{className:"clickzone",style:{left:0},onClick:()=>go(-1)}),
    e("div",{className:"clickzone",style:{right:0},onClick:()=>go(1)}),
    e("div",{className:"slide "+(s.cls||"")},
      s.title? e("h2",null,s.title):null,
      s.body()),
    e("div",{className:"bar"}, e("div",{style:{width:((i+1)/SLIDES.length*100)+"%"}})),
    e("div",{className:"foot"},
      e("span",null, e("b",null,"CS-1-01 (MO)")," · Deck 1 · Logistics"),
      e("span",{className:"navhint"},"← → to navigate"),
      e("span",null, (i+1)+" / "+SLIDES.length)));
}
ReactDOM.createRoot(document.getElementById("root")).render(e(Deck));
</script>
</body>
</html>

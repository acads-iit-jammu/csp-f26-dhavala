<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck 07 · Types, Assignments & Operators · CS-1-01 (MO)</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Slab:wght@400;600;700&family=Roboto+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#003f87; --blue-dark:#002d63; --blue-mid:#0056b8; --blue-sky:#4da3ff; --blue-pale:#eaf3ff;
    --ink:#22262a; --star:#f4b400;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0b1e3a;font-family:Roboto,system-ui,sans-serif;color:var(--ink)}
  #root{height:100%}
  .deck{height:100%;display:flex;flex-direction:column;overflow:hidden}
  .slide{flex:1;display:flex;flex-direction:column;justify-content:center;padding:5vh 8vw;
         background:#fff;overflow:auto}
  .slide.title{background:linear-gradient(160deg,var(--blue-dark) 0%,var(--blue) 70%,var(--blue-mid) 100%);color:#fff}
  .slide.accent{background:linear-gradient(160deg,#f6faff,var(--blue-pale))}
  h1{font-family:"Roboto Slab",serif;font-size:clamp(1.8rem,4.5vw,3.2rem);margin:.2em 0;line-height:1.15}
  h2{font-family:"Roboto Slab",serif;font-size:clamp(1.4rem,3vw,2.2rem);color:var(--blue-dark);margin:.2em 0 .6em;
     border-bottom:3px solid var(--blue-pale);padding-bottom:.25em}
  .title h2{color:#cfe3ff;border:none;font-weight:400;font-size:clamp(1rem,2vw,1.5rem)}
  .kicker{font-size:clamp(.8rem,1.4vw,1rem);letter-spacing:.14em;text-transform:uppercase;color:var(--blue-sky)}
  p,li{font-size:clamp(1rem,1.9vw,1.35rem);line-height:1.55}
  li{margin:.35em 0}
  .big{font-size:clamp(1.3rem,2.6vw,1.9rem);font-weight:500;color:var(--blue-dark)}
  table{border-collapse:collapse;font-size:clamp(.95rem,1.7vw,1.25rem);margin:.4em 0;width:100%}
  th{background:var(--blue);color:#fff;text-align:left}
  th,td{border:1px solid #cfdcec;padding:.35em .7em}
  tr:nth-child(even) td{background:#f4f8fd}
  code,.mono{font-family:"Roboto Mono",monospace;color:var(--blue-mid)}
  .cols{display:flex;gap:4vw;flex-wrap:wrap}
  .cols>div{flex:1;min-width:260px}
  .note{background:var(--blue-pale);border-left:5px solid var(--blue);padding:.5em 1em;border-radius:0 8px 8px 0;
        font-size:clamp(.95rem,1.7vw,1.2rem)}
  .quote{font-family:"Roboto Slab",serif;font-size:clamp(1.4rem,3.4vw,2.4rem);color:var(--blue-dark);
         text-align:center;line-height:1.4;margin:auto 0}
  .quote small{display:block;font-family:Roboto,sans-serif;font-size:.55em;color:#667;margin-top:1em}
  /* chrome */
  .bar{height:5px;background:#12305c}
  .bar>div{height:100%;background:var(--blue-sky);transition:width .25s}
  .foot{display:flex;justify-content:space-between;align-items:center;background:#0b1e3a;color:#8fb4e8;
        font-size:.75rem;padding:6px 14px;font-family:"Roboto Mono",monospace}
  .foot b{color:#cfe3ff;font-weight:500}
  .navhint{opacity:.7}
  .clickzone{position:fixed;top:0;bottom:30px;width:18vw;cursor:pointer;z-index:5}
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";
const e = React.createElement;
const F = React.Fragment;

/* ---------- content ---------- */
const li = (...items)=> e("ul",null, ...items.map(t=> e("li",{dangerouslySetInnerHTML:{__html:t}})));
const html = (tag,s)=> e(tag,{dangerouslySetInnerHTML:{__html:s}});
const table = (head,rows)=> e("table",null,
  e("thead",null, e("tr",null, ...head.map(hh=>e("th",null,hh)))),
  e("tbody",null, ...rows.map(r=> e("tr",null, ...r.map(c=> html("td",c))))));

const SLIDES = [
{cls:"title", body:()=> e(F,null,
  e("div",{className:"kicker"},"CS-1-01 (MO) · Monsoon 2026 · W03 · Lecture 2"),
  e("h1",null,"Types, Assignments & Operators"),
  e("h2",null,"Deck 07 — the wardrobe of types, and the grammar between the variables"),
  e("p",{style:{marginTop:"2em",color:"#cfe3ff"}},"Soma S Dhavala · Electrical / Mechanical / Materials"),
  e("p",{style:{color:"#8fb4e8",fontSize:"1rem"}},"→ arrow keys or click the right edge to advance"))},

{title:"Where we are", body:()=> e(F,null,
  li("Yesterday: the three-step ritual (write → compile → run), <span class='mono'>hello.c</span> line by line, and one type — <span class='mono'>int</span>: <i>a named cell with a reading convention</i>",
     "Today, the rest of Lec 4's territory: the full <b>wardrobe of basic types</b>, what <span class='mono'>=</span> really does, and the <b>grammar</b> C uses when several operators meet in one expression"),
  html("div",'<div class="note">One sentence carries the whole day: <b>a type = a size + a reading convention</b>. You already own both halves — sizes from bits and bytes, conventions from two\'s complement and FP32.</div>'))},

{title:"The wardrobe: C's basic types", body:()=> e(F,null,
  table(["Type","Size*","Reading convention","Edge of its world"],[
    ["<span class='mono'>char</span>","1 byte","a small integer — usually worn with the <b>code book</b> (ASCII): 72 = 'H'","−128…127 <i>on our machines</i> — see below*"],
    ["<span class='mono'>int</span>","4 bytes","two's complement — Monday's guest of honour","±2,147,483,647 (the Gangnam number)"],
    ["<span class='mono'>float</span>","4 bytes","IEEE FP32 — you dissected it bit by bit in Week 2","~7 digits, ~10³⁸"],
    ["<span class='mono'>double</span>","8 bytes","FP64 — same anatomy, bigger costume (this is what Python uses)","~16 digits, ~10³⁰⁸"]]),
  li("*A confession about <span class='mono'>char</span>: whether plain char is signed is <b>the machine's choice</b> — the standard offers <span class='mono'>signed char</span> (−128…127) and <span class='mono'>unsigned char</span> (0…255) for when you care, and leaves plain <span class='mono'>char</span> implementation-defined. Our gcc/x86 lab machines make it signed, so <span class='mono'>char c = -5;</span> genuinely works there. ASCII needs only 0–127 — safe under either choice, which is exactly why the standard could afford to leave it loose",
     "Sizes are also “on our machines” — C promises only minimums; <span class='mono'>sizeof(int)</span> asks the machine itself. Try it: <span class='mono'>printf(\"%zu\\n\", sizeof(int));</span>",
     "The deep point, again: <span class='mono'>char c = 'H';</span> and <span class='mono'>char c = 72;</span> put the <i>same bits</i> in the cell. The type and the format specifier decide the reading: <span class='mono'>%c</span> prints H, <span class='mono'>%d</span> prints 72"))},

{title:"Declaration, initialization, assignment", body:()=> e(F,null,
  table(["Statement","What actually happens"],[
    ["<span class='mono'>int marks;</span>","<b>declaration</b>: reserve a 4-byte cell, name it — contents are <i>garbage</i> until you write (C does not tidy up for you!)"],
    ["<span class='mono'>int marks = 42;</span>","declaration + <b>initialization</b>: reserve, name, and write 42 — the habit to prefer"],
    ["<span class='mono'>marks = 87;</span>","<b>assignment</b>: overwrite the cell — the old 42 is gone, no undo"]]),
  html("p",'<span class="big">And the line that breaks school algebra: <span class="mono">x = x + 1;</span></span>'),
  li("This is <b>not an equation</b> (no x satisfies it!). <span class='mono'>=</span> is a <b>command</b>, and the two sides play different roles: <b>right side = compute a value</b> (read x's cell, add 1) · <b>left side = the destination cell</b> (store the result back)",
     "Read every <span class='mono'>=</span> aloud as <b>“gets”</b>, never “equals”: <i>x gets x plus one</i>. The toy computer said the same thing in three words: LDA, ADD, STA"))},

{title:"The arithmetic operators", body:()=> e(F,null,
  table(["Operator","Name","On ints: example","Watch out"],[
    ["<span class='mono'>+ − *</span>","add, subtract, multiply","<span class='mono'>6*7 → 42</span>","overflow is silent (Monday's cliff lives inside)"],
    ["<span class='mono'>/</span>","division","<span class='mono'>7/2 → 3</span>","<b>integer ÷ integer = integer</b> — the fraction is discarded, not rounded: −7/2 → −3"],
    ["<span class='mono'>%</span>","remainder (modulo)","<span class='mono'>7%2 → 1</span>, <span class='mono'>17%5 → 2</span>","ints only; priceless for even/odd (<span class='mono'>n%2</span>), digits (<span class='mono'>n%10</span>), wrap-around"],
    ["<span class='mono'>−x</span>","unary minus","<span class='mono'>-marks</span>","binds tighter than the pair operators"]]),
  html("p",'The pair <span class="mono">/</span> and <span class="mono">%</span> are the divide-by-2 story from Week 2, wearing operator costumes: <span class="mono">42/2</span> and <span class="mono">42%2</span> are exactly the quotient-and-remainder table you built by hand.'))},

{title:"Precedence — the grammar when operators meet", body:()=> e(F,null,
  html("p",'What is <span class="big mono">2 + 3 * 4</span> ? C answers <b>14</b>, never 20 — because the language has fixed grammar, the same one your school BODMAS taught:'),
  table(["Rank","Operators","Associativity (ties read…)"],[
    ["1","<span class='mono'>( )</span>","— parentheses always win; use them whenever a reader might blink"],
    ["2","unary <span class='mono'>−</span>","right to left"],
    ["3","<span class='mono'>* / %</span>","left to right"],
    ["4","<span class='mono'>+ −</span>","left to right"],
    ["5","<span class='mono'>=</span>","<b>right to left</b>: <span class='mono'>a = b = 0</span> fills b first, then a"]]),
  li("Associativity settles ties between equals: <span class='mono'>10 − 4 − 3</span> = (10−4)−3 = <b>3</b>, never 10−(4−3) = 9",
     "The honest engineering rule: memorize this much, and for anything subtler <b>write the parentheses</b>. Cleverness is not a virtue in expressions — readability is"))},

{title:"Mixed types: promotion, truncation, casts", body:()=> e(F,null,
  table(["Expression","Value","Why"],[
    ["<span class='mono'>7 / 2</span>","<b>3</b>","int ÷ int → int; fraction discarded"],
    ["<span class='mono'>7.0 / 2</span>","<b>3.5</b>","one side is double → the int is <b>promoted</b>, real division happens"],
    ["<span class='mono'>(double) 7 / 2</span>","<b>3.5</b>","a <b>cast</b>: explicitly re-dress 7 as a double, then divide"],
    ["<span class='mono'>int x = 3.9;</span>","x is <b>3</b>","assigning a real to an int cell <b>truncates</b> — silently, no warning, no rounding"]]),
  html("div",'<div class="note">A pattern is emerging about C\'s character: like overflow, these conversions are <b>silent</b>. C assumes you meant what you typed. That is its power on the metal floor — and why <i>predict before you run</i> is a survival habit, not a classroom ritual.</div>'))},

{title:"Predict before you run — six little exams", body:()=> e(F,null,
  html("p",'Cover the right column. Commit to an answer <i>on paper</i>, then reveal. (All variables are <span class="mono">int</span> unless shown.)'),
  table(["Expression","Answer — and the rule that decides it"],[
    ["<span class='mono'>5 + 2 * 3 − 1</span>","<b>10</b> — * first, then left to right"],
    ["<span class='mono'>(5 + 2) * (3 − 1)</span>","<b>14</b> — parentheses always win"],
    ["<span class='mono'>17 % 5 + 1</span>","<b>3</b> — % ranks with *, before +"],
    ["<span class='mono'>1 / 2 * 10</span>","<b>0</b> — left to right: 1/2 is 0 <i>first</i>, then 0*10. The classic trap"],
    ["<span class='mono'>10 * 1.0 / 4</span>","<b>2.5</b> — the 1.0 promotes the whole ride"],
    ["<span class='mono'>double d = 7 / 2;</span>","<b>3.0</b> — too late! 7/2 became 3 <i>before</i> it met the double cell"]]),
  html("p",'The last one fools second-years and interview candidates alike: <b>the type of the destination does not reach back into the expression</b>. Each operator looks only at its own two operands.'))},

{title:"This week", body:()=> e(F,null,
  li("<b>Type and run</b> the six predictions — where the machine disagrees with your paper, the disagreement is the lesson: find the rule you misapplied",
     "<b>Play:</b> print <span class='mono'>sizeof</span> of all four types on your machine; print the same <span class='mono'>char</span> with <span class='mono'>%c</span> and <span class='mono'>%d</span>",
     "<b>Write:</b> a program that takes a 3-digit number in a variable and prints its three digits on separate lines — you own every tool it needs (<span class='mono'>/</span>, <span class='mono'>%</span>, and Week 2's positional insight)",
     "<b>Class Test 1</b> window is open (through Aug 25) — scope W01–W03; Deck 05 is your complements & overflow revision"),
  html("div",'<div class="note">Next: expressions meet decisions — boolean expressions and <span class="mono">if</span>. The program finally gets to choose.</div>'))},

];

/* ---------- deck engine ---------- */
function Deck(){
  const [i,setI] = React.useState(()=>{
    const n=parseInt(location.hash.slice(1)); return Number.isInteger(n)&&n>=0&&n<SLIDES.length? n:0; });
  const go = React.useCallback(d=>{
    setI(cur=>{ const n=Math.min(SLIDES.length-1, Math.max(0, cur+d)); location.hash="#"+n; return n; });
  },[]);
  React.useEffect(()=>{
    const k=ev=>{ if(["ArrowRight","PageDown"," "].includes(ev.key)) go(1);
                  else if(["ArrowLeft","PageUp"].includes(ev.key)) go(-1);
                  else if(ev.key==="Home"){ setI(0); location.hash="#0"; } };
    window.addEventListener("keydown",k); return ()=>window.removeEventListener("keydown",k);
  },[go]);
  const s=SLIDES[i];
  return e("div",{className:"deck"},
    e("div",{className:"clickzone",style:{left:0},onClick:()=>go(-1)}),
    e("div",{className:"clickzone",style:{right:0},onClick:()=>go(1)}),
    e("div",{className:"slide "+(s.cls||"")},
      s.title? e("h2",null,s.title):null,
      s.body()),
    e("div",{className:"bar"}, e("div",{style:{width:((i+1)/SLIDES.length*100)+"%"}})),
    e("div",{className:"foot"},
      e("span",null, e("b",null,"CS-1-01 (MO)")," · Deck 07 · Types, Assignments & Operators"),
      e("span",{className:"navhint"},"← → to navigate"),
      e("span",null, (i+1)+" / "+SLIDES.length)));
}
ReactDOM.createRoot(document.getElementById("root")).render(e(Deck));
</script>
</body>
</html>

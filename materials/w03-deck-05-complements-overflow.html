<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck 05 · Complements & Overflow · CS-1-01 (MO)</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Slab:wght@400;600;700&family=Roboto+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#003f87; --blue-dark:#002d63; --blue-mid:#0056b8; --blue-sky:#4da3ff; --blue-pale:#eaf3ff;
    --ink:#22262a; --star:#f4b400;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0b1e3a;font-family:Roboto,system-ui,sans-serif;color:var(--ink)}
  #root{height:100%}
  .deck{height:100%;display:flex;flex-direction:column;overflow:hidden}
  .slide{flex:1;display:flex;flex-direction:column;justify-content:center;padding:5vh 8vw;
         background:#fff;overflow:auto}
  .slide.title{background:linear-gradient(160deg,var(--blue-dark) 0%,var(--blue) 70%,var(--blue-mid) 100%);color:#fff}
  .slide.accent{background:linear-gradient(160deg,#f6faff,var(--blue-pale))}
  h1{font-family:"Roboto Slab",serif;font-size:clamp(1.8rem,4.5vw,3.2rem);margin:.2em 0;line-height:1.15}
  h2{font-family:"Roboto Slab",serif;font-size:clamp(1.4rem,3vw,2.2rem);color:var(--blue-dark);margin:.2em 0 .6em;
     border-bottom:3px solid var(--blue-pale);padding-bottom:.25em}
  .title h2{color:#cfe3ff;border:none;font-weight:400;font-size:clamp(1rem,2vw,1.5rem)}
  .kicker{font-size:clamp(.8rem,1.4vw,1rem);letter-spacing:.14em;text-transform:uppercase;color:var(--blue-sky)}
  p,li{font-size:clamp(1rem,1.9vw,1.35rem);line-height:1.55}
  li{margin:.35em 0}
  .big{font-size:clamp(1.3rem,2.6vw,1.9rem);font-weight:500;color:var(--blue-dark)}
  table{border-collapse:collapse;font-size:clamp(.95rem,1.7vw,1.25rem);margin:.4em 0;width:100%}
  th{background:var(--blue);color:#fff;text-align:left}
  th,td{border:1px solid #cfdcec;padding:.35em .7em}
  tr:nth-child(even) td{background:#f4f8fd}
  code,.mono{font-family:"Roboto Mono",monospace;color:var(--blue-mid)}
  .cols{display:flex;gap:4vw;flex-wrap:wrap}
  .cols>div{flex:1;min-width:260px}
  .note{background:var(--blue-pale);border-left:5px solid var(--blue);padding:.5em 1em;border-radius:0 8px 8px 0;
        font-size:clamp(.95rem,1.7vw,1.2rem)}
  .quote{font-family:"Roboto Slab",serif;font-size:clamp(1.4rem,3.4vw,2.4rem);color:var(--blue-dark);
         text-align:center;line-height:1.4;margin:auto 0}
  .quote small{display:block;font-family:Roboto,sans-serif;font-size:.55em;color:#667;margin-top:1em}
  /* chrome */
  .bar{height:5px;background:#12305c}
  .bar>div{height:100%;background:var(--blue-sky);transition:width .25s}
  .foot{display:flex;justify-content:space-between;align-items:center;background:#0b1e3a;color:#8fb4e8;
        font-size:.75rem;padding:6px 14px;font-family:"Roboto Mono",monospace}
  .foot b{color:#cfe3ff;font-weight:500}
  .navhint{opacity:.7}
  .clickzone{position:fixed;top:0;bottom:30px;width:18vw;cursor:pointer;z-index:5}
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";
const e = React.createElement;
const F = React.Fragment;

/* ---------- content ---------- */
const li = (...items)=> e("ul",null, ...items.map(t=> e("li",{dangerouslySetInnerHTML:{__html:t}})));
const html = (tag,s)=> e(tag,{dangerouslySetInnerHTML:{__html:s}});
const table = (head,rows)=> e("table",null,
  e("thead",null, e("tr",null, ...head.map(hh=>e("th",null,hh)))),
  e("tbody",null, ...rows.map(r=> e("tr",null, ...r.map(c=> html("td",c))))));

const SLIDES = [
{cls:"title", body:()=> e(F,null,
  e("div",{className:"kicker"},"CS-1-01 (MO) · Monsoon 2026 · W03 · Lecture 1"),
  e("h1",null,"Negative Numbers, and the Edge of the World"),
  e("h2",null,"Deck 05 — one's & two's complement, worked; and what happens at the cliff"),
  e("p",{style:{marginTop:"2em",color:"#cfe3ff"}},"Soma S Dhavala · Electrical / Mechanical / Materials"),
  e("p",{style:{color:"#8fb4e8",fontSize:"1rem"}},"→ arrow keys or click the right edge to advance"))},

{title:"Where we stopped: no minus sign in a cell", body:()=> e(F,null,
  li("A cell holds bits. The − you write on paper is a <i>symbol</i> — machines store only 0s and 1s",
     "Last week you met three conventions for reading the same bits: <b>sign-magnitude</b> (first bit = sign), <b>one's complement</b> (flip every bit), <b>two's complement</b> (flip, then add 1)",
     "Today: work them properly, add with them, and discover what happens at the edge of the range"),
  html("div",'<div class="note">Keep the sundial in your head: one pattern, four readings — <b>meaning lives in the dial</b>. Today we mostly stand on the two\'s-complement ring, because every real machine does.</div>'))},

{title:"One's complement — flip everything", body:()=> e(F,null,
  html("p",'<span class="big">To negate: flip every bit.</span> 8-bit examples:'),
  table(["Decimal","Pattern","How"],[
    ["+5","<span class='mono'>00000101</span>","just binary 5"],
    ["−5","<span class='mono'>11111010</span>","flip every bit of +5"],
    ["+42","<span class='mono'>00101010</span>","binary 42"],
    ["−42","<span class='mono'>11010101</span>","flip every bit of +42"]]),
  li("Reading rule: sign bit 1 → it is negative; flip everything back to see the magnitude",
     "The flaw you already found on the sundial: <b>two zeros</b> — <span class='mono'>00000000</span> (+0) and <span class='mono'>11111111</span> (−0). Two names for nothing means special cases in hardware",
     "Adding needs an awkward patch (the “end-around carry”) — workable, but nobody loved it"))},

{title:"Two's complement — flip, then add one", body:()=> e(F,null,
  html("p",'<span class="big">To negate: flip every bit, then add 1.</span> Worked, in 8 bits:'),
  table(["Step","−5","−42"],[
    ["start with the positive","<span class='mono'>00000101</span>","<span class='mono'>00101010</span>"],
    ["flip every bit","<span class='mono'>11111010</span>","<span class='mono'>11010101</span>"],
    ["add 1","<span class='mono'>11111011</span>","<span class='mono'>11010110</span>"]]),
  li("One zero only. One adder does addition <i>and</i> subtraction. That is why it won — everywhere",
     "8-bit range: <b>−128 … +127</b>. Note the asymmetry: <span class='mono'>10000000</span> is −128, and +128 does not exist — negate −128 and you get… −128. A genuine edge case that bites real programs",
     "Fast sanity check for any pattern: sign bit set? Then value = (unsigned reading) − 256 (for 8 bits). <span class='mono'>11010110</span> = 214 − 256 = <b>−42</b> ✓"))},

{title:"Arithmetic just works — two examples", body:()=> e(F,null,
  html("p",'<b>Example 1 — a number plus its negation:</b> 42 + (−42):'),
  html("p",'<span class="mono">&nbsp;&nbsp;00101010<br>+ 11010110<br>= 1 00000000 → the ninth bit falls off the 8-bit edge → <b>00000000</b> ✓</span>'),
  html("p",'<b>Example 2 — mixed signs:</b> 25 + (−42):'),
  html("p",'<span class="mono">&nbsp;&nbsp;00011001<br>+ 11010110<br>= 11101111 → sign bit 1 → 239 − 256 = <b>−17</b> ✓</span>'),
  html("div",'<div class="note">No special cases, no sign logic — the <i>same</i> ripple adder you built from gates does all of it. The cleverness is entirely in the <b>convention</b>.</div>'))},

{title:"The edge of the world: overflow", body:()=> e(F,null,
  html("p",'<span class="big">Overflow = the true result does not fit the cells you gave it.</span> The dial made it visible: +7 + 1 on 4 bits lands on <b>−8</b>. Now in 8 bits:'),
  html("p",'<b>100 + 50:</b>'),
  html("p",'<span class="mono">&nbsp;&nbsp;01100100&nbsp;&nbsp;(+100)<br>+ 00110010&nbsp;&nbsp;(+50)<br>= 10010110&nbsp;&nbsp;→ sign bit 1 → 150 − 256 = <b>−106</b>&nbsp;&nbsp;⚠</span>'),
  li("The adder did nothing wrong — every carry was honest. The <i>range</i> ran out: +150 needs 9 bits, we gave it 8",
     "Smell test: <b>two positives that “sum” to a negative</b> (or two negatives to a positive) = overflow, guaranteed. Mixed signs can never overflow",
     "Overflow is silent. No alarm, no error — just a wrong number that <i>looks</i> confident. (Remember the FDIV column: wrong numbers compound.)"))},

{title:"Overflow is not a toy problem", body:()=> e(F,null,
  li("<b>1996 — Ariane 5, flight 501:</b> a 64-bit velocity value was squeezed into a <b>16-bit signed integer</b> (max 32,767). The new rocket flew faster than the old software imagined; the conversion overflowed; 37 seconds after lift-off, the rocket destroyed itself. One representation decision, ~half a billion dollars",
     "<b>2014 — “Gangnam Style”:</b> YouTube's view counter was a 32-bit signed int — max <span class='mono'>2,147,483,647</span>. One video threatened to cross it; YouTube moved to 64 bits",
     "<b>2038 — already scheduled:</b> Unix clocks that count seconds in a signed 32-bit int overflow on <b>19 Jan 2038, 03:14:07 UTC</b> — and jump to 1901. Systems being written <i>today</i> must care"),
  html("div",'<div class="note">Same number every time: 2,147,483,647 = 2³¹ − 1 — the +127 of your 8-bit world, grown up. The cliff scales; the physics of the cliff does not change. More in this week\'s PAGAL column.</div>'))},

{title:"This week — and a date to circle", body:()=> e(F,null,
  li("<b>Practice:</b> write −77 and −128 in 8-bit two's complement; compute 90 + 90 in 8 bits and explain the result; verify −(−128) = −128 by flip-and-add-one",
     "<b>Playground:</b> the sundial's +1 button around the full circle — narrate each cliff you cross",
     "<b>Tomorrow:</b> your first real C program — where these bit patterns finally get a language"),
  html("div",'<div class="note"><b>Class Test 1 window opens Wednesday (Aug 19–25).</b> Scope: Weeks 1–3 — what a computer is, number systems, complements, overflow. The exact date/time will be announced in class and on the site.</div>'))},

];

/* ---------- deck engine ---------- */
function Deck(){
  const [i,setI] = React.useState(()=>{
    const n=parseInt(location.hash.slice(1)); return Number.isInteger(n)&&n>=0&&n<SLIDES.length? n:0; });
  const go = React.useCallback(d=>{
    setI(cur=>{ const n=Math.min(SLIDES.length-1, Math.max(0, cur+d)); location.hash="#"+n; return n; });
  },[]);
  React.useEffect(()=>{
    const k=ev=>{ if(["ArrowRight","PageDown"," "].includes(ev.key)) go(1);
                  else if(["ArrowLeft","PageUp"].includes(ev.key)) go(-1);
                  else if(ev.key==="Home"){ setI(0); location.hash="#0"; } };
    window.addEventListener("keydown",k); return ()=>window.removeEventListener("keydown",k);
  },[go]);
  const s=SLIDES[i];
  return e("div",{className:"deck"},
    e("div",{className:"clickzone",style:{left:0},onClick:()=>go(-1)}),
    e("div",{className:"clickzone",style:{right:0},onClick:()=>go(1)}),
    e("div",{className:"slide "+(s.cls||"")},
      s.title? e("h2",null,s.title):null,
      s.body()),
    e("div",{className:"bar"}, e("div",{style:{width:((i+1)/SLIDES.length*100)+"%"}})),
    e("div",{className:"foot"},
      e("span",null, e("b",null,"CS-1-01 (MO)")," · Deck 05 · Complements & Overflow"),
      e("span",{className:"navhint"},"← → to navigate"),
      e("span",null, (i+1)+" / "+SLIDES.length)));
}
ReactDOM.createRoot(document.getElementById("root")).render(e(Deck));
</script>
</body>
</html>

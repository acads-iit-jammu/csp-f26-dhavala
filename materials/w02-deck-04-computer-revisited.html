<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck 04 · The Computer, Revisited · CS-1-01 (MO)</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Slab:wght@400;600;700&family=Roboto+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#003f87; --blue-dark:#002d63; --blue-mid:#0056b8; --blue-sky:#4da3ff; --blue-pale:#eaf3ff;
    --ink:#22262a; --star:#f4b400;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0b1e3a;font-family:Roboto,system-ui,sans-serif;color:var(--ink)}
  #root{height:100%}
  .deck{height:100%;display:flex;flex-direction:column;overflow:hidden}
  .slide{flex:1;display:flex;flex-direction:column;justify-content:center;padding:5vh 8vw;
         background:#fff;overflow:auto}
  .slide.title{background:linear-gradient(160deg,var(--blue-dark) 0%,var(--blue) 70%,var(--blue-mid) 100%);color:#fff}
  .slide.accent{background:linear-gradient(160deg,#f6faff,var(--blue-pale))}
  h1{font-family:"Roboto Slab",serif;font-size:clamp(1.8rem,4.5vw,3.2rem);margin:.2em 0;line-height:1.15}
  h2{font-family:"Roboto Slab",serif;font-size:clamp(1.4rem,3vw,2.2rem);color:var(--blue-dark);margin:.2em 0 .6em;
     border-bottom:3px solid var(--blue-pale);padding-bottom:.25em}
  .title h2{color:#cfe3ff;border:none;font-weight:400;font-size:clamp(1rem,2vw,1.5rem)}
  .kicker{font-size:clamp(.8rem,1.4vw,1rem);letter-spacing:.14em;text-transform:uppercase;color:var(--blue-sky)}
  p,li{font-size:clamp(1rem,1.9vw,1.35rem);line-height:1.55}
  li{margin:.35em 0}
  .big{font-size:clamp(1.3rem,2.6vw,1.9rem);font-weight:500;color:var(--blue-dark)}
  table{border-collapse:collapse;font-size:clamp(.95rem,1.7vw,1.25rem);margin:.4em 0;width:100%}
  th{background:var(--blue);color:#fff;text-align:left}
  th,td{border:1px solid #cfdcec;padding:.35em .7em}
  tr:nth-child(even) td{background:#f4f8fd}
  code,.mono{font-family:"Roboto Mono",monospace;color:var(--blue-mid)}
  .cols{display:flex;gap:4vw;flex-wrap:wrap}
  .cols>div{flex:1;min-width:260px}
  .note{background:var(--blue-pale);border-left:5px solid var(--blue);padding:.5em 1em;border-radius:0 8px 8px 0;
        font-size:clamp(.95rem,1.7vw,1.2rem)}
  .quote{font-family:"Roboto Slab",serif;font-size:clamp(1.4rem,3.4vw,2.4rem);color:var(--blue-dark);
         text-align:center;line-height:1.4;margin:auto 0}
  .quote small{display:block;font-family:Roboto,sans-serif;font-size:.55em;color:#667;margin-top:1em}
  /* chrome */
  .bar{height:5px;background:#12305c}
  .bar>div{height:100%;background:var(--blue-sky);transition:width .25s}
  .foot{display:flex;justify-content:space-between;align-items:center;background:#0b1e3a;color:#8fb4e8;
        font-size:.75rem;padding:6px 14px;font-family:"Roboto Mono",monospace}
  .foot b{color:#cfe3ff;font-weight:500}
  .navhint{opacity:.7}
  .clickzone{position:fixed;top:0;bottom:30px;width:18vw;cursor:pointer;z-index:5}
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";
const e = React.createElement;
const F = React.Fragment;

/* ---------- content ---------- */
const li = (...items)=> e("ul",null, ...items.map(t=> e("li",{dangerouslySetInnerHTML:{__html:t}})));
const html = (tag,s)=> e(tag,{dangerouslySetInnerHTML:{__html:s}});
const table = (head,rows)=> e("table",null,
  e("thead",null, e("tr",null, ...head.map(hh=>e("th",null,hh)))),
  e("tbody",null, ...rows.map(r=> e("tr",null, ...r.map(c=> html("td",c))))));

const SLIDES = [
{cls:"title", body:()=> e(F,null,
  e("div",{className:"kicker"},"CS-1-01 (MO) · Monsoon 2026 · W02 · Lecture 1"),
  e("h1",null,"The Computer, Revisited"),
  e("h2",null,"Deck 04 — from turtle steps to von Neumann, and a machine you can program"),
  e("p",{style:{marginTop:"2em",color:"#cfe3ff"}},"Soma S Dhavala · Electrical / Mechanical / Materials"),
  e("p",{style:{color:"#8fb4e8",fontSize:"1rem"}},"→ arrow keys or click the right edge to advance"))},

{title:"Where we have been — two machines, two lessons", body:()=> e(F,null,
  table(["Machine","What it was","What it taught"],[
    ["<b>The Turtle</b>","a grid, a crayon, and a language of ten tap-able words (START, LEFT, CONTINUE n, …)","<i>programming</i>: a program is a precise plan; the machine does what you <b>said</b>, never what you meant — and new words get invented when problems demand them"],
    ["<b>The Display machine</b>","five numbers in memory — read · write · move · count · check — that printed a text, one code at a time","<i>the stored procedure</i>: the plan itself lives <b>in memory, as numbers</b>, right beside the data it works on"]]),
  html("div",'<div class="note">Two glimpses of the same object from different sides: what computing <i>feels</i> like, and where the procedure <i>lives</i>. Today we put the two together — and give the design its proper name.</div>'))},

{title:"The design has a name: von Neumann architecture", body:()=> e(F,null,
  li("<b>1945.</b> John von Neumann writes up the design of EDVAC (building on the ENIAC engineers Eckert &amp; Mauchly): one memory holding <b>both the procedure and the data</b>, a control unit running the eternal ritual — <i>fetch the next order → carry it out → repeat</i> — an arithmetic unit, and I/O",
     "The radical part was not the arithmetic. It was the address book: <b>instructions are numbers, stored in the same cells as data</b>",
     "Consequences we have already tasted: a machine can be re-taught by rewriting memory (no screwdriver) — and a program can even read or edit <i>itself</i>",
     "Eighty years later, your phone, your laptop, the controller in a washing machine — <b>still this one design</b>"),
  html("div",'<div class="note">When people say “a computer”, they almost always mean: <b>a von Neumann machine — a stored-program computer</b>.</div>'))},

{title:"Meet the Toy Computer", body:()=> e(F,null,
  html("p",'A complete von Neumann machine, small enough to see all of at once:'),
  li("<b>40 memory cells</b>, each holding a 3-digit number — instruction cells tinted blue, data cells green (a courtesy for your eyes: <i>the machine cannot tell them apart</i>)",
     "<b>Two registers you can watch:</b> the ACC (its one “hand” for arithmetic) and the PC (the finger pointing at the next order)",
     "<b>Ten words</b>: INP, OUT, LDA (load), STA (store), ADD, SUB, BRA (jump), BRZ / BRP (jump-if), HLT — plus DAT to reserve a data cell",
     "Each instruction <i>is</i> a 3-digit number: first digit says which action, the last two say which cell — <span class='mono'>105</span> means “ADD cell 05”"),
  html("p",'We will drive it in class: write a plan, load it, and watch the ritual — fetch, decode, execute — narrated step by step.'))},

{title:"A caution: it adds and subtracts. So… isn't this just a calculator?", body:()=> e(F,null,
  html("p",'<span class="big">Argue it out. By our own Deck-02 definition — which is it?</span>'),
  table(["A calculator","The Toy Computer"],[
    ["adds, subtracts — ability <b>frozen into its wiring</b>","adds, subtracts — ability <b>written into its memory</b>"],
    ["press the same keys, get the same behaviour, forever","load different cells → a <i>different machine</i>: a counter, a max-finder, a multiplier, a printer"],
    ["to change its job: a screwdriver (rebuild it)","to change its job: <b>store a new procedure</b> — no tools"]]),
  html("p",'So no — arithmetic is not what makes a calculator a calculator. <b>The dividing line is where the procedure lives.</b> Frozen in wiring → calculator. Stored in memory as numbers → computer. The Toy passes the von Neumann test: <i>can you change its job without a screwdriver?</i>'))},

{title:"One example, climbed six times", body:()=> e(F,null,
  html("p",'On the Toy we will work a single problem — <b>adding two integers</b> — six times, each rung adding exactly one idea:'),
  table(["Rung","New idea"],[
    ["1 · add two numbers","<b>sequence</b> — steps, in order"],
    ["2 · add, but clamp at zero","<b>branching</b> — the program chooses a path"],
    ["3 · add by counting","<b>loops</b> — repeat + count + stop, with an invariant to watch"],
    ["4 · multiply","<b>composition</b> — big ideas are loops of smaller ones"],
    ["5 · double, twice, via one shared plan","<b>subroutines</b> — and the program <i>edits its own code</i> to remember the way back"],
    ["6 · sum(n), recursively","<b>the wall</b> — the toy computes the right answer and can never report it. Why? One return-address cell. The fix, a <i>stack</i>, awaits you in C"]]),
  html("div",'<div class="note">Rung 6 fails <i>on purpose</i>. Watching a machine trap itself teaches more than ten definitions of recursion.</div>'))},

{title:"And one honest confession", body:()=> e(F,null,
  e("div",{className:"quote"},"The Toy holds 3-digit decimal numbers.",e("br"),"Real silicon holds no such thing.",
    e("small",null,"Decimal cells are a kindness we built for your eyes. A real cell is a row of switches — two states, 0 and 1 — and every number must live there. How? That is tomorrow's lecture: number systems. Bring the question: what is 72, really?")))},

];

/* ---------- deck engine ---------- */
function Deck(){
  const [i,setI] = React.useState(()=>{
    const n=parseInt(location.hash.slice(1)); return Number.isInteger(n)&&n>=0&&n<SLIDES.length? n:0; });
  const go = React.useCallback(d=>{
    setI(cur=>{ const n=Math.min(SLIDES.length-1, Math.max(0, cur+d)); location.hash="#"+n; return n; });
  },[]);
  React.useEffect(()=>{
    const k=ev=>{ if(["ArrowRight","PageDown"," "].includes(ev.key)) go(1);
                  else if(["ArrowLeft","PageUp"].includes(ev.key)) go(-1);
                  else if(ev.key==="Home"){ setI(0); location.hash="#0"; } };
    window.addEventListener("keydown",k); return ()=>window.removeEventListener("keydown",k);
  },[go]);
  const s=SLIDES[i];
  return e("div",{className:"deck"},
    e("div",{className:"clickzone",style:{left:0},onClick:()=>go(-1)}),
    e("div",{className:"clickzone",style:{right:0},onClick:()=>go(1)}),
    e("div",{className:"slide "+(s.cls||"")},
      s.title? e("h2",null,s.title):null,
      s.body()),
    e("div",{className:"bar"}, e("div",{style:{width:((i+1)/SLIDES.length*100)+"%"}})),
    e("div",{className:"foot"},
      e("span",null, e("b",null,"CS-1-01 (MO)")," · Deck 04 · The Computer, Revisited"),
      e("span",{className:"navhint"},"← → to navigate"),
      e("span",null, (i+1)+" / "+SLIDES.length)));
}
ReactDOM.createRoot(document.getElementById("root")).render(e(Deck));
</script>
</body>
</html>

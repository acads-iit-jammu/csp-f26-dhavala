<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck 2 · What is a Computer? · CS-1-01 (MO)</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Slab:wght@400;600;700&family=Roboto+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#003f87; --blue-dark:#002d63; --blue-mid:#0056b8; --blue-sky:#4da3ff; --blue-pale:#eaf3ff;
    --ink:#22262a; --star:#f4b400;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0b1e3a;font-family:Roboto,system-ui,sans-serif;color:var(--ink)}
  #root{height:100%}
  .deck{height:100%;display:flex;flex-direction:column;overflow:hidden}
  .slide{flex:1;display:flex;flex-direction:column;justify-content:center;padding:5vh 8vw;
         background:#fff;overflow:auto}
  .slide.title{background:linear-gradient(160deg,var(--blue-dark) 0%,var(--blue) 70%,var(--blue-mid) 100%);color:#fff}
  .slide.accent{background:linear-gradient(160deg,#f6faff,var(--blue-pale))}
  h1{font-family:"Roboto Slab",serif;font-size:clamp(1.8rem,4.5vw,3.2rem);margin:.2em 0;line-height:1.15}
  h2{font-family:"Roboto Slab",serif;font-size:clamp(1.4rem,3vw,2.2rem);color:var(--blue-dark);margin:.2em 0 .6em;
     border-bottom:3px solid var(--blue-pale);padding-bottom:.25em}
  .title h2{color:#cfe3ff;border:none;font-weight:400;font-size:clamp(1rem,2vw,1.5rem)}
  .kicker{font-size:clamp(.8rem,1.4vw,1rem);letter-spacing:.14em;text-transform:uppercase;color:var(--blue-sky)}
  p,li{font-size:clamp(1rem,1.9vw,1.35rem);line-height:1.55}
  li{margin:.35em 0}
  .big{font-size:clamp(1.3rem,2.6vw,1.9rem);font-weight:500;color:var(--blue-dark)}
  table{border-collapse:collapse;font-size:clamp(.95rem,1.7vw,1.25rem);margin:.4em 0;width:100%}
  th{background:var(--blue);color:#fff;text-align:left}
  th,td{border:1px solid #cfdcec;padding:.35em .7em}
  tr:nth-child(even) td{background:#f4f8fd}
  code,.mono{font-family:"Roboto Mono",monospace;color:var(--blue-mid)}
  .cols{display:flex;gap:4vw;flex-wrap:wrap}
  .cols>div{flex:1;min-width:260px}
  .note{background:var(--blue-pale);border-left:5px solid var(--blue);padding:.5em 1em;border-radius:0 8px 8px 0;
        font-size:clamp(.95rem,1.7vw,1.2rem)}
  .quote{font-family:"Roboto Slab",serif;font-size:clamp(1.4rem,3.4vw,2.4rem);color:var(--blue-dark);
         text-align:center;line-height:1.4;margin:auto 0}
  .quote small{display:block;font-family:Roboto,sans-serif;font-size:.55em;color:#667;margin-top:1em}
  /* chrome */
  .bar{height:5px;background:#12305c}
  .bar>div{height:100%;background:var(--blue-sky);transition:width .25s}
  .foot{display:flex;justify-content:space-between;align-items:center;background:#0b1e3a;color:#8fb4e8;
        font-size:.75rem;padding:6px 14px;font-family:"Roboto Mono",monospace}
  .foot b{color:#cfe3ff;font-weight:500}
  .navhint{opacity:.7}
  .clickzone{position:fixed;top:0;bottom:30px;width:18vw;cursor:pointer;z-index:5}
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";
const e = React.createElement;
const F = React.Fragment;

/* ---------- content ---------- */
const li = (...items)=> e("ul",null, ...items.map(t=> e("li",{dangerouslySetInnerHTML:{__html:t}})));
const html = (tag,s)=> e(tag,{dangerouslySetInnerHTML:{__html:s}});
const table = (head,rows)=> e("table",null,
  e("thead",null, e("tr",null, ...head.map(hh=>e("th",null,hh)))),
  e("tbody",null, ...rows.map(r=> e("tr",null, ...r.map(c=> html("td",c))))));

const SLIDES = [
{cls:"title", body:()=> e(F,null,
  e("div",{className:"kicker"},"CS-1-01 (MO) · Monsoon 2026 · W01 · Lecture 2"),
  e("h1",null,"What is Computing? What is a Computer?"),
  e("h2",null,"Deck 2 — four words that sound the same, and aren't"),
  e("p",{style:{marginTop:"2em",color:"#cfe3ff"}},"Soma S Dhavala · Electrical / Mechanical / Materials"),
  e("p",{style:{color:"#8fb4e8",fontSize:"1rem"}},"→ arrow keys or click the right edge to advance"))},

{title:"Four words, disentangled", body:()=> e(F,null,
  table(["Word","What it really is"],[
    ["<b>Computing</b>","a <i>process</i>: transforming representations by rule. It needs no programmer and no silicon — long division computes; an abacus computes. Computing <i>happens</i>"],
    ["<b>A computer</b>","a <i>thing</i>: a physical system engineered so its state changes carry out computing reliably"],
    ["<b>Programming</b>","an <i>act</i>: authorship — externalizing your plan into a notation an executor can follow"],
    ["<b>Computational thinking</b>","a <i>habit</i>: shaping problems so their solutions can become computations"]]),
  html("div",'<div class="note">Humans think computationally · machines compute · <b>programming is the handoff between the two</b>.</div>'))},

{title:"A puzzle: one of these is a computer. One is not.", body:()=> e(F,null,
  html("p",'Picture two machines on a desk. On the left, an <b>adding machine</b>: two dials for the numbers, wheels and levers inside, a window that shows the sum. On the right, a box of numbered <b>memory cells</b> with a small engine that reads them one by one and does what they say.'),
  table(["The adding machine","The memory-and-engine box"],[
    ["computes: set the dials, out comes the sum","computes too, one small step at a time"],
    ["can do <b>one thing</b>, forever. Its ability is frozen into its gears","can be <b>re-taught endlessly</b>: count down, find the largest, multiply, print — just by changing what the cells hold"],
    ["to change its job you must <i>rebuild the machine</i>","to change its job you <b>write a new procedure into its memory</b> — and it follows it"]]),
  html("p",'<span class="big">The dividing line is the <b>stored program</b>.</span> A computer is a computing machine whose <i>procedure is data</i> — written into the same memory it works on. That single idea is the whole revolution.'))},

{title:"So what is any computer made of?", body:()=> e(F,null,
  li("<b>Memory</b> — numbered cells holding numbers, nothing more",
     "<b>Data</b> — numbers the procedure works <i>on</i>",
     "<b>Instructions</b> — numbers the machine reads as orders. <i>Same cells as the data</i> — the machine cannot tell them apart, and that is a feature",
     "<b>The orchestrator</b> — the small control circuit that keeps the ritual going: fetch the next order → carry it out → repeat"),
  html("div",'<div class="note">And below all four: logic gates, and below those, switches — ordinary physical parts, all the way down. Nothing is magic.</div>'))},

{title:"Computational thinking — the habit", body:()=> e(F,null,
  html("p",'<span class="big">Before any code: shape the problem so a computation can solve it.</span>'),
  li("<b>Decompose</b> — cut the big problem into small ones",
     "<b>Abstract</b> — name a thing, hide its details, reuse it",
     "<b>Find the pattern</b> — “this is the same move, again” is the birth of every loop",
     "<b>Make it a procedure</b> — steps so precise that anyone — or anything — can follow them"),
  html("p",'No computer required. In fact, you have been doing all four your whole life — two proofs on the next slide.'))},

{title:"You already think computationally", body:()=> e(F,null,
  table(["The move","🥕 Buying vegetables","🏖️ Planning a holiday"],[
    ["<b>Decompose</b>","the errand splits: make a list → walk to the shop → pick each item → pay → walk home","the trip splits: destination → dates → budget → tickets → stay → day plans → packing"],
    ["<b>Abstract</b>","“the list” — one page standing in for the whole kitchen's needs; “the usual way” hides every turn of the walk","“the budget” — one number standing in for a thousand decisions; “Day 2: old town” hides all its logistics"],
    ["<b>Pattern</b>","for <i>each</i> item: find the stall → check freshness and price → into the bag. Same move, repeated — a loop over the list","every day has the same skeleton: breakfast → sight → lunch → sight → back. A loop, with “which sight” as the changing part"],
    ["<b>Procedure</b>","hand the list and cash to your sibling — dinner still happens. <i>That</i> is the test: the plan works without you","an itinerary the family can follow while you nap on the bus — and a check at the end: bookings confirmed, bags packed"]]),
  html("div",'<div class="note">This course does not teach you a new way of thinking — it takes a habit you already have, makes it <b>precise</b>, and teaches you to hand the procedure to a machine.</div>'))},

{title:"What does printf actually do?", body:()=> e(F,null,
  html("p",'Take a tiny world: a two-letter alphabet, coded <b>a = 11, b = 12</b>. Then the text “abba” lives in memory as <span style="font-family:\'Roboto Mono\',monospace"><b>11&nbsp;12&nbsp;12&nbsp;11</b></span>, with a counter set to 4. And printf translates to a five-word procedure:'),
  table(["Code","Word","What it does"],[
    ["1","<b>READ</b>","copy the letter under the finger into the hand"],
    ["2","<b>WRITE</b>","send the hand to the display, which looks the number up in its <i>code book</i>"],
    ["3","<b>MOVE</b>","slide the finger one cell right"],
    ["4","<b>COUNT</b>","tick the counter down"],
    ["5","<b>CHECK</b>","counter at zero? stop — else back to the top"]]),
  html("p",'Twenty small steps later, the display says <b>abba</b>. And <span class="big">printf("Hello, world!") is the <i>same five words</i></span> — only the counter says 13 and the code book has 128 entries (ASCII, agreed in 1963: <b>72 = H</b>). Scale lives in the data.'))},

{title:"The deepest idea of the week", body:()=> e(F,null,
  e("div",{className:"quote"},"Meaning lives in the reader,",e("br"),"not in the bits.",
    e("small",null,"In that memory, 1–5 are orders (the machine reads them) and 11–12 are letters (the display reads them). Nothing in the numbers says which is which — only the reader decides. Instructions, data, text: one substance, many readings.")))},

{title:"A question to take home", body:()=> e(F,null,
  e("div",{className:"quote"},"Why does 72 mean H?",
    e("small",null,"Because in 1963, people agreed it would. Codes are conventions — which raises the real question: how do the numbers themselves live inside the machine? That is Week 2: number systems. Meanwhile: this week's missions are on the course site.")))},

];

/* ---------- deck engine ---------- */
function Deck(){
  const [i,setI] = React.useState(()=>{
    const n=parseInt(location.hash.slice(1)); return Number.isInteger(n)&&n>=0&&n<SLIDES.length? n:0; });
  const go = React.useCallback(d=>{
    setI(cur=>{ const n=Math.min(SLIDES.length-1, Math.max(0, cur+d)); location.hash="#"+n; return n; });
  },[]);
  React.useEffect(()=>{
    const k=ev=>{ if(["ArrowRight","PageDown"," "].includes(ev.key)) go(1);
                  else if(["ArrowLeft","PageUp"].includes(ev.key)) go(-1);
                  else if(ev.key==="Home"){ setI(0); location.hash="#0"; } };
    window.addEventListener("keydown",k); return ()=>window.removeEventListener("keydown",k);
  },[go]);
  const s=SLIDES[i];
  return e("div",{className:"deck"},
    e("div",{className:"clickzone",style:{left:0},onClick:()=>go(-1)}),
    e("div",{className:"clickzone",style:{right:0},onClick:()=>go(1)}),
    e("div",{className:"slide "+(s.cls||"")},
      s.title? e("h2",null,s.title):null,
      s.body()),
    e("div",{className:"bar"}, e("div",{style:{width:((i+1)/SLIDES.length*100)+"%"}})),
    e("div",{className:"foot"},
      e("span",null, e("b",null,"CS-1-01 (MO)")," · Deck 2 · Computing, Computers, Programming"),
      e("span",{className:"navhint"},"← → to navigate"),
      e("span",null, (i+1)+" / "+SLIDES.length)));
}
ReactDOM.createRoot(document.getElementById("root")).render(e(Deck));
</script>
</body>
</html>

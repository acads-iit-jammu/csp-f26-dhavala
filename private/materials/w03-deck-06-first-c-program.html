<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck 06 · Your First C Program · CS-1-01 (MO)</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Slab:wght@400;600;700&family=Roboto+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#003f87; --blue-dark:#002d63; --blue-mid:#0056b8; --blue-sky:#4da3ff; --blue-pale:#eaf3ff;
    --ink:#22262a; --star:#f4b400;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0b1e3a;font-family:Roboto,system-ui,sans-serif;color:var(--ink)}
  #root{height:100%}
  .deck{height:100%;display:flex;flex-direction:column;overflow:hidden}
  .slide{flex:1;display:flex;flex-direction:column;justify-content:center;padding:5vh 8vw;
         background:#fff;overflow:auto}
  .slide.title{background:linear-gradient(160deg,var(--blue-dark) 0%,var(--blue) 70%,var(--blue-mid) 100%);color:#fff}
  .slide.accent{background:linear-gradient(160deg,#f6faff,var(--blue-pale))}
  h1{font-family:"Roboto Slab",serif;font-size:clamp(1.8rem,4.5vw,3.2rem);margin:.2em 0;line-height:1.15}
  h2{font-family:"Roboto Slab",serif;font-size:clamp(1.4rem,3vw,2.2rem);color:var(--blue-dark);margin:.2em 0 .6em;
     border-bottom:3px solid var(--blue-pale);padding-bottom:.25em}
  .title h2{color:#cfe3ff;border:none;font-weight:400;font-size:clamp(1rem,2vw,1.5rem)}
  .kicker{font-size:clamp(.8rem,1.4vw,1rem);letter-spacing:.14em;text-transform:uppercase;color:var(--blue-sky)}
  p,li{font-size:clamp(1rem,1.9vw,1.35rem);line-height:1.55}
  li{margin:.35em 0}
  .big{font-size:clamp(1.3rem,2.6vw,1.9rem);font-weight:500;color:var(--blue-dark)}
  table{border-collapse:collapse;font-size:clamp(.95rem,1.7vw,1.25rem);margin:.4em 0;width:100%}
  th{background:var(--blue);color:#fff;text-align:left}
  th,td{border:1px solid #cfdcec;padding:.35em .7em}
  tr:nth-child(even) td{background:#f4f8fd}
  code,.mono{font-family:"Roboto Mono",monospace;color:var(--blue-mid)}
  .cols{display:flex;gap:4vw;flex-wrap:wrap}
  .cols>div{flex:1;min-width:260px}
  .note{background:var(--blue-pale);border-left:5px solid var(--blue);padding:.5em 1em;border-radius:0 8px 8px 0;
        font-size:clamp(.95rem,1.7vw,1.2rem)}
  .quote{font-family:"Roboto Slab",serif;font-size:clamp(1.4rem,3.4vw,2.4rem);color:var(--blue-dark);
         text-align:center;line-height:1.4;margin:auto 0}
  .quote small{display:block;font-family:Roboto,sans-serif;font-size:.55em;color:#667;margin-top:1em}
  /* chrome */
  .bar{height:5px;background:#12305c}
  .bar>div{height:100%;background:var(--blue-sky);transition:width .25s}
  .foot{display:flex;justify-content:space-between;align-items:center;background:#0b1e3a;color:#8fb4e8;
        font-size:.75rem;padding:6px 14px;font-family:"Roboto Mono",monospace}
  .foot b{color:#cfe3ff;font-weight:500}
  .navhint{opacity:.7}
  .clickzone{position:fixed;top:0;bottom:30px;width:18vw;cursor:pointer;z-index:5}
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";
const e = React.createElement;
const F = React.Fragment;

/* ---------- content ---------- */
const li = (...items)=> e("ul",null, ...items.map(t=> e("li",{dangerouslySetInnerHTML:{__html:t}})));
const html = (tag,s)=> e(tag,{dangerouslySetInnerHTML:{__html:s}});
const table = (head,rows)=> e("table",null,
  e("thead",null, e("tr",null, ...head.map(hh=>e("th",null,hh)))),
  e("tbody",null, ...rows.map(r=> e("tr",null, ...r.map(c=> html("td",c))))));

const SLIDES = [
{cls:"title", body:()=> e(F,null,
  e("div",{className:"kicker"},"CS-1-01 (MO) · Monsoon 2026 · W03 · Lecture 2"),
  e("h1",null,"Your First C Program"),
  e("h2",null,"Deck 06 — write it, compile it, run it: the three-step ritual, for real"),
  e("p",{style:{marginTop:"2em",color:"#cfe3ff"}},"Soma S Dhavala · Electrical / Mechanical / Materials"),
  e("p",{style:{color:"#8fb4e8",fontSize:"1rem"}},"→ arrow keys or click the right edge to advance"))},

{title:"You have already done all three steps", body:()=> e(F,null,
  li("In Lab 01 you ran three commands on faith: edit a file, run <span class='mono'>gcc</span>, run <span class='mono'>./hello</span>. Today, the faith becomes understanding",
     "The ritual is always the same: <b>1) WRITE</b> a plan in a text file · <b>2) COMPILE</b> — translate it for the machine · <b>3) RUN</b> the translation",
     "It is the Toy Computer's story one floor up: there, <i>you</i> put the numbers in the cells. Here, a program called a <b>compiler</b> writes the numbers for you — from a language made for humans"),
  html("div",'<div class="note">C, 1972, Dennis Ritchie, Bell Labs. Old enough to have grandchildren (most languages you\'ve heard of are its descendants), and still the language of engines, kernels, and microcontrollers — the metal-facing floor.</div>'))},

{title:"Anatomy of hello.c — every line has a job", body:()=> e(F,null,
  html("p",'<span class="mono" style="font-size:1.1em">#include &lt;stdio.h&gt;<br><br>int main(void) {<br>&nbsp;&nbsp;&nbsp;&nbsp;printf("Hello, world!\\n");<br>&nbsp;&nbsp;&nbsp;&nbsp;return 0;<br>}</span>'),
  table(["Line","Its job"],[
    ["<span class='mono'>#include &lt;stdio.h&gt;</span>","“borrow the standard I/O toolbox” — printf lives there; we never build what we can borrow"],
    ["<span class='mono'>int main(void)</span>","the <b>entry point</b> — every C program begins at main, exactly one, like the Turtle's START"],
    ["<span class='mono'>{ … }</span>","the braces hold main's plan — its steps, in order"],
    ["<span class='mono'>printf(\"…\");</span>","print the text; <span class='mono'>\\\\n</span> means “new line” (a character you can't see — code 10!); the <b>;</b> ends the step"],
    ["<span class='mono'>return 0;</span>","main reports back: 0 = “all went well” — someone is always listening (the shell!)"]]),
  html("p",'Five lines. You met this exact program as five toy-machine words — <i>read · write · move · count · check</i>. Same plan, new notation.'))},

{title:"Step 2, annotated: the compile command", body:()=> e(F,null,
  html("p",'<span class="big mono">gcc&nbsp;&nbsp;hello.c&nbsp;&nbsp;-o&nbsp;&nbsp;hello</span>'),
  table(["Word","Meaning"],[
    ["<span class='mono'>gcc</span>","the compiler (GNU C Compiler) — itself just a program, one that reads programs"],
    ["<span class='mono'>hello.c</span>","your <b>source file</b>: honest text, readable by humans, meaningless to the processor"],
    ["<span class='mono'>-o hello</span>","“name the <b>o</b>utput <i>hello</i>” — without it you'd get the historical default name <span class='mono'>a.out</span>"]]),
  li("<b>Silence means success.</b> The compiler speaks only when something is wrong — and then it names the <i>line number</i>. Always read the <b>first</b> error first; the rest are often echoes",
     "What comes out is an <b>executable</b>: a file of machine numbers — the real machine's version of the Toy Computer's cells. Run <span class='mono'>ls -l</span> and see it appear"))},

{title:"Step 3, annotated: the run command", body:()=> e(F,null,
  html("p",'<span class="big mono">./hello</span>'),
  table(["Part","Meaning"],[
    ["<span class='mono'>./</span>","“the one <b>right here</b>, in this folder” — the shell only searches its trusted list of places ($PATH), and your folder is deliberately not on it"],
    ["<span class='mono'>hello</span>","the executable the compiler just wrote"]]),
  li("The loader copies your numbers into memory, points the machine at the entry (main — the PC set to cell 0, one floor up), and the ritual runs: fetch, decode, execute",
     "When main hits <span class='mono'>return 0;</span> the program ends and the shell takes the prompt back — and quietly records that 0"),
  html("div",'<div class="note">The full pipeline has more rooms inside (preprocessor, assembler, linker) — we will open those doors in two weeks. Today: <b>source in, executable out, and nothing in between is magic</b>.</div>'))},

{title:"Variables — a named cell, with a reading convention", body:()=> e(F,null,
  html("p",'<span class="mono" style="font-size:1.05em">int marks = 42;</span>'),
  li("<b>int</b> — the <b>type</b>: “reserve a cell of 32 bits, and <i>read it as a two's-complement integer</i>.” After yesterday, you know exactly what that means — including its cliff at ±2,147,483,647",
     "<b>marks</b> — the <b>name</b>: in the toy machine you wrote cell numbers (STA 07); C lets you <i>name</i> the cell and never think about its address again. Abstraction!",
     "<b>= 42</b> — the initial value written into the cell",
     "A type is a <i>reading convention</i> — the week-1 lesson wearing a keyword: the same bits under <span class='mono'>char</span> would be a letter from the code book"),
  html("p",'Printing a variable needs a <b>format specifier</b> — printf\'s own little code book: <span class="mono">printf("marks = %d\\n", marks);</span> — <span class="mono">%d</span> means “a decimal integer goes here.”'))},

{title:"Two small programs, worked", body:()=> e(F,null,
  html("p",'<b>1 · Add two numbers</b> — the spine\'s rung 1, in its final costume:'),
  html("p",'<span class="mono">int main(void) {<br>&nbsp;&nbsp;&nbsp;&nbsp;int a = 7;<br>&nbsp;&nbsp;&nbsp;&nbsp;int b = 35;<br>&nbsp;&nbsp;&nbsp;&nbsp;int c = a + b;<br>&nbsp;&nbsp;&nbsp;&nbsp;printf("%d\\n", c);<br>&nbsp;&nbsp;&nbsp;&nbsp;return 0;<br>}</span>'),
  html("p",'<b>2 · Predict before you run</b> — what does this print, and why?'),
  html("p",'<span class="mono">int x = 7;<br>int y = x / 2;<br>printf("%d\\n", y);</span>'),
  html("p",'(It prints <b>3</b>, not 3.5 — an <span class="mono">int</span> cell cannot hold a half; integer division <i>floors</i>. Types decide arithmetic. Much more of this next week.)'))},

{title:"This week", body:()=> e(F,null,
  li("<b>Type, compile, run</b> both programs from today — prediction first, then the machine's verdict",
     "<b>Break things on purpose:</b> delete the semicolon, misspell printf, remove the ./ — read each error aloud and map it to what you changed. Compiler messages are a skill",
     "<b>Try:</b> make <span class='mono'>c = a + b</span> overflow — what values of a and b expose yesterday's cliff inside int?",
     "<b>Class Test 1</b> window is open (Aug 19–25) — scope W01–W03; details in class"),
  html("div",'<div class="note">Next week: operators, expressions and precedence — the grammar between the variables.</div>'))},

];

/* ---------- deck engine ---------- */
function Deck(){
  const [i,setI] = React.useState(()=>{
    const n=parseInt(location.hash.slice(1)); return Number.isInteger(n)&&n>=0&&n<SLIDES.length? n:0; });
  const go = React.useCallback(d=>{
    setI(cur=>{ const n=Math.min(SLIDES.length-1, Math.max(0, cur+d)); location.hash="#"+n; return n; });
  },[]);
  React.useEffect(()=>{
    const k=ev=>{ if(["ArrowRight","PageDown"," "].includes(ev.key)) go(1);
                  else if(["ArrowLeft","PageUp"].includes(ev.key)) go(-1);
                  else if(ev.key==="Home"){ setI(0); location.hash="#0"; } };
    window.addEventListener("keydown",k); return ()=>window.removeEventListener("keydown",k);
  },[go]);
  const s=SLIDES[i];
  return e("div",{className:"deck"},
    e("div",{className:"clickzone",style:{left:0},onClick:()=>go(-1)}),
    e("div",{className:"clickzone",style:{right:0},onClick:()=>go(1)}),
    e("div",{className:"slide "+(s.cls||"")},
      s.title? e("h2",null,s.title):null,
      s.body()),
    e("div",{className:"bar"}, e("div",{style:{width:((i+1)/SLIDES.length*100)+"%"}})),
    e("div",{className:"foot"},
      e("span",null, e("b",null,"CS-1-01 (MO)")," · Deck 06 · Your First C Program"),
      e("span",{className:"navhint"},"← → to navigate"),
      e("span",null, (i+1)+" / "+SLIDES.length)));
}
ReactDOM.createRoot(document.getElementById("root")).render(e(Deck));
</script>
</body>
</html>

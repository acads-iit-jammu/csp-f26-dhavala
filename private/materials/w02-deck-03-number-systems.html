<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck 03 · Number Systems · CS-1-01 (MO)</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Slab:wght@400;600;700&family=Roboto+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#003f87; --blue-dark:#002d63; --blue-mid:#0056b8; --blue-sky:#4da3ff; --blue-pale:#eaf3ff;
    --ink:#22262a; --star:#f4b400;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0b1e3a;font-family:Roboto,system-ui,sans-serif;color:var(--ink)}
  #root{height:100%}
  .deck{height:100%;display:flex;flex-direction:column;overflow:hidden}
  .slide{flex:1;display:flex;flex-direction:column;justify-content:center;padding:5vh 8vw;
         background:#fff;overflow:auto}
  .slide.title{background:linear-gradient(160deg,var(--blue-dark) 0%,var(--blue) 70%,var(--blue-mid) 100%);color:#fff}
  .slide.accent{background:linear-gradient(160deg,#f6faff,var(--blue-pale))}
  h1{font-family:"Roboto Slab",serif;font-size:clamp(1.8rem,4.5vw,3.2rem);margin:.2em 0;line-height:1.15}
  h2{font-family:"Roboto Slab",serif;font-size:clamp(1.4rem,3vw,2.2rem);color:var(--blue-dark);margin:.2em 0 .6em;
     border-bottom:3px solid var(--blue-pale);padding-bottom:.25em}
  .title h2{color:#cfe3ff;border:none;font-weight:400;font-size:clamp(1rem,2vw,1.5rem)}
  .kicker{font-size:clamp(.8rem,1.4vw,1rem);letter-spacing:.14em;text-transform:uppercase;color:var(--blue-sky)}
  p,li{font-size:clamp(1rem,1.9vw,1.35rem);line-height:1.55}
  li{margin:.35em 0}
  .big{font-size:clamp(1.3rem,2.6vw,1.9rem);font-weight:500;color:var(--blue-dark)}
  table{border-collapse:collapse;font-size:clamp(.95rem,1.7vw,1.25rem);margin:.4em 0;width:100%}
  th{background:var(--blue);color:#fff;text-align:left}
  th,td{border:1px solid #cfdcec;padding:.35em .7em}
  tr:nth-child(even) td{background:#f4f8fd}
  code,.mono{font-family:"Roboto Mono",monospace;color:var(--blue-mid)}
  .cols{display:flex;gap:4vw;flex-wrap:wrap}
  .cols>div{flex:1;min-width:260px}
  .note{background:var(--blue-pale);border-left:5px solid var(--blue);padding:.5em 1em;border-radius:0 8px 8px 0;
        font-size:clamp(.95rem,1.7vw,1.2rem)}
  .quote{font-family:"Roboto Slab",serif;font-size:clamp(1.4rem,3.4vw,2.4rem);color:var(--blue-dark);
         text-align:center;line-height:1.4;margin:auto 0}
  .quote small{display:block;font-family:Roboto,sans-serif;font-size:.55em;color:#667;margin-top:1em}
  /* chrome */
  .bar{height:5px;background:#12305c}
  .bar>div{height:100%;background:var(--blue-sky);transition:width .25s}
  .foot{display:flex;justify-content:space-between;align-items:center;background:#0b1e3a;color:#8fb4e8;
        font-size:.75rem;padding:6px 14px;font-family:"Roboto Mono",monospace}
  .foot b{color:#cfe3ff;font-weight:500}
  .navhint{opacity:.7}
  .clickzone{position:fixed;top:0;bottom:30px;width:18vw;cursor:pointer;z-index:5}
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";
const e = React.createElement;
const F = React.Fragment;

/* ---------- content ---------- */
const li = (...items)=> e("ul",null, ...items.map(t=> e("li",{dangerouslySetInnerHTML:{__html:t}})));
const html = (tag,s)=> e(tag,{dangerouslySetInnerHTML:{__html:s}});
const table = (head,rows)=> e("table",null,
  e("thead",null, e("tr",null, ...head.map(hh=>e("th",null,hh)))),
  e("tbody",null, ...rows.map(r=> e("tr",null, ...r.map(c=> html("td",c))))));

const SLIDES = [
{cls:"title", body:()=> e(F,null,
  e("div",{className:"kicker"},"CS-1-01 (MO) · Monsoon 2026 · W02 · Aug 10 & 11"),
  e("h1",null,"Number Systems"),
  e("h2",null,"Deck 03 — how numbers live inside a machine"),
  e("p",{style:{marginTop:"2em",color:"#cfe3ff"}},"Soma S Dhavala · Electrical / Mechanical / Materials"),
  e("p",{style:{color:"#8fb4e8",fontSize:"1rem"}},"→ arrow keys or click the right edge to advance"))},

{title:"Anchor 1 — the letter that was never there", body:()=> e(F,null,
  html("p",'<span class="big">Last week, a display printed “H” — and there was no H anywhere in the machine.</span>'),
  li("What travelled through the wires was <b>72</b>, and the display owned a <i>code book</i> that says 72 = H",
     "So characters were never a new kind of thing: they are <b>numbers wearing a convention</b> (ASCII, agreed 1963)",
     "But be honest: that answer only pushed the mystery one level down. What is <b>72 itself</b>, inside a cell? Not the symbol “7” next to a “2” — symbols are for humans",
     "We owe ourselves that story. It is this week's story"),
  html("div",'<div class="note">Theme of the week: a number is an <i>idea</i>; a numeral is a <i>costume</i>. Never confuse the two.</div>'))},

{title:"Anchor 2 — buying shoes with arithmetic", body:()=> e(F,null,
  html("p",'Open Amazon or Flipkart and type <span class="mono">“running shoes size 9”</span>. Follow what the machine must do:'),
  li("Your keystrokes become codes — Anchor 1, again: characters are numbers in a convention",
     "But now the store must think about <b>shoes</b> — physical, leather-and-laces objects. It cannot. It has never seen one",
     "What it has is a <b>numeric portrait</b> of each shoe: <span class='mono'>product 4432871 · size 9 · colour-code 12 (red) · price 2499.00 · stock 14 · rating 4.3</span>",
     "Every act of shopping is <b>arithmetic on portraits</b>: “only size 9” compares numbers · “price: low to high” compares numbers · “customers also liked” measures <i>distances between lists of numbers</i>",
     "The shoe stays in the warehouse. Only its portrait shops with you"),
  html("div",'<div class="note">And here is why <b>returns</b> exist: the portrait is <i>lossy</i>. Nobody encoded the smell of the leather or how it feels on <i>your</i> foot. Deciding what makes it into the portrait — what about the world becomes a number — is a design act, and somebody must own it. (Week 1 echo: the spec is a model of the world.)</div>'))},

{title:"So numbers have two stories — and this week tells one", body:()=> e(F,null,
  table(["Story","The question it answers","Examples you have met"],[
    ["<b>Semantics</b>","<i>what</i> do the numbers stand for?","72 = H (a code book) · the shoe's portrait · a turtle's steps. The course returns to this, week after week"],
    ["<b>Syntax</b>","how is a number <i>itself</i> written and stored?","bases and bits, two's complement, floating point — <b>this week's business</b>"]]),
  li("The two stories meet violently when syntax fails semantics: a rounding you ignored, a range you overflowed — tiny syntactic slips that corrupt what the numbers <i>meant</i> (this week's PAGAL column has a $475-million example)",
     "So for the rest of the week we go down the stack: how the machine writes whole numbers, negative numbers, and real numbers — starting from the one idea underneath every numeral ever written"))},

{title:"Radix-q: one idea behind every numeral", body:()=> e(F,null,
  html("p",'Pick a base q and some digit symbols. Then a numeral is a row of digits, and its value is <span class="big">position × power of q</span>:'),
  html("p",'<span class="mono" style="font-size:1.2em">d₂ d₁ d₀ &nbsp;means&nbsp; d₂·q² + d₁·q¹ + d₀·q⁰</span>'),
  table(["Base q","Name","Digits","The number forty-two"],[
    ["1","tally (before positions!)","|","|||| |||| |||| |||| |||| |||| |||| |||| ||"],
    ["2","binary","0 1","101010"],
    ["3","ternary","0 1 2","1120"],
    ["10","decimal (your ten fingers)","0…9","42"],
    ["16","hexadecimal","0…9 A…F","2A"]]),
  html("p",'Same number, five costumes. The value never changed — only the convention for writing it. Any q ≥ 2 works; q = 10 won because of anatomy, not mathematics.'))},

{title:"Why machines chose binary", body:()=> e(F,null,
  li("At the bottom, a machine is made of switches: <b>on or off</b>, pressure or no pressure. Two states, cheap and unmistakable",
     "You <i>could</i> build ten-state hardware — but distinguishing ten voltage levels reliably, billions of times a second, in heat and noise, is fragile. Two levels are robust",
     "So the machine's digits are 0 and 1 — <b>bits</b> — and every number wears its binary costume",
     "Eight bits make a <b>byte</b>; a cell of n bits can wear 2ⁿ different faces (8 bits → 256; 32 bits → about 4.3 billion)"),
  html("div",'<div class="note">Binary is not “computer math.” It is ordinary radix arithmetic, in the only costume cheap physics can wear reliably.</div>'))},

{title:"Conversions — both directions, one worked number", body:()=> e(F,null,
  html("p",'<b>Binary → decimal:</b> add up the weights.'),
  html("p",'<span class="mono">101010 = 1·32 + 0·16 + 1·8 + 0·4 + 1·2 + 0·1 = <b>42</b></span>'),
  html("p",'<b>Decimal → binary:</b> divide by 2, keep the remainders, read them <i>upward</i>.'),
  table(["Divide","Quotient","Remainder"],[
    ["42 ÷ 2","21","0"],["21 ÷ 2","10","1"],["10 ÷ 2","5","0"],
    ["5 ÷ 2","2","1"],["2 ÷ 2","1","0"],["1 ÷ 2","0","1"]]),
  html("p",'Read the remainder column bottom-to-top: <span class="mono"><b>101010</b></span>. And hexadecimal is just binary shorthand — each hex digit is exactly 4 bits: <span class="mono">0010 1010 = 2A</span>.'))},

{title:"Negative numbers: there is no minus sign in a cell", body:()=> e(F,null,
  html("p",'A cell holds bits — nothing else. Where does the − go? Three conventions, in historical order (8-bit examples):'),
  table(["Scheme","−42 looks like","The catch"],[
    ["<b>Sign-magnitude</b>: first bit = sign","1<span class='mono'>0101010</span>","two zeros (+0 and −0); adder needs special cases"],
    ["<b>One's complement</b>: flip every bit","<span class='mono'>11010101</span>","still two zeros"],
    ["<b>Two's complement</b>: flip every bit, then add 1","<span class='mono'>11010110</span>","none worth crying about — the winner"]]),
  li("Two's complement's magic: the <b>same adder circuit</b> does addition and subtraction — no special cases. That is why every real machine uses it",
     "8 bits span −128 … +127; in general, −2ⁿ⁻¹ … 2ⁿ⁻¹−1 — note the asymmetry!",
     "Quick sanity check: <span class='mono'>00101010</span> (42) + <span class='mono'>11010110</span> (−42) = <span class='mono'>00000000</span> ✓ (the carry out falls off the edge)"))},

{title:"Real numbers, attempt 1: fixed point", body:()=> e(F,null,
  html("p",'Numbers with fractions? First idea: park an imaginary binary point at a fixed position.'),
  html("p",'<span class="mono" style="font-size:1.1em">101.101 = 4 + 1 + ½ + ⅛ = <b>5.625</b></span>'),
  li("Simple and fast — the hardware is just integer arithmetic with a bookkeeping convention",
     "But the point is <b>stuck</b>: with 3 fraction bits you can never say anything finer than ⅛, and your largest number is capped",
     "Fine for money (paise are a fixed point!), rough for science: the diameter of an atom and the distance to the Moon don't fit one ruler"),
  html("div",'<div class="note">What we want: a ruler whose <i>scale slides</i> — few big numbers, few tiny numbers, decent precision everywhere. Enter floating point.</div>'))},

{title:"Floating point = binary scientific notation", body:()=> e(F,null,
  html("p",'You already know the trick from chemistry class: 6.022 × 10²³. Keep a few <b>significant digits</b> and a <b>magnitude</b>. Floating point is exactly that, in base 2:'),
  html("p",'<span class="big mono">± 1.fffff… × 2^e</span>'),
  li("<b>sign</b> — one bit",
     "<b>exponent e</b> — where the point floats (the sliding scale)",
     "<b>fraction (mantissa)</b> — the significant digits",
     "One clever freebie: in binary the leading digit is always 1, so it isn't even stored — a free bit of precision"))},

{title:"IEEE FP32 — the world's standard 32-bit real", body:()=> e(F,null,
  table(["Field","Bits","Role"],[
    ["sign","1","0 = +, 1 = −"],
    ["exponent","8","stored with a <b>bias of 127</b>: stored 129 means e = 2"],
    ["fraction","23","the digits after the hidden leading 1"]]),
  html("p",'<span class="big mono">value = (−1)<sup>s</sup> × (1 + f ⁄ 2²³) × 2<sup>(e − 127)</sup></span>'),
  html("p",'<span style="font-size:.85em;color:#667">— the exact formula for normal numbers, where s is the sign bit, e the stored 8-bit exponent (1…254), and f the 23-bit fraction read as an integer. (For e = 0: value = (−1)<sup>s</sup> × (f ⁄ 2²³) × 2<sup>−126</sup> — the subnormals.)</span>'),
  html("p",'<b>Worked example — 6.5:</b> &nbsp;6.5 = <span class="mono">110.1</span> = <span class="mono">1.101 × 2²</span> → sign <span class="mono">0</span>, exponent 2+127 = 129 = <span class="mono">10000001</span>, fraction <span class="mono">101</span>0000…'),
  html("p",'<span class="mono">0 10000001 10100000000000000000000</span>'),
  li("Special costumes reserved: all-zeros exponent (zero &amp; tiny “subnormals”), all-ones (infinity and <b>NaN</b> — not-a-number)",
     "Precision: 23 stored bits + the hidden 1 = <b>24 significant bits</b>. One binary digit is worth log₁₀2 ≈ 0.301 decimal digits, so 24 × 0.301 ≈ <b>7.2 decimal digits</b> — that is where “about 7 digits” comes from (2²⁴ ≈ 16.7 million distinct significands). Magnitudes: ~10⁻³⁸ to ~10³⁸",
     "A warning you will meet in C: <b>0.1 has no exact binary costume</b> — it is a repeating binary fraction, stored rounded. Never test real numbers with =="))},

{title:"“But my Python prints 0.1 back just fine…”", body:()=> e(F,null,
  html("p",'A fair objection: floats cannot store 0.1 exactly — yet type <span class="mono">0.1</span> into a Python terminal and it cheerfully prints <span class="mono">0.1</span>. Caught between two claims, always run the experiment. Here is what is actually happening:'),
  li("What gets <b>stored</b> is the nearest representable double: <span class='mono'>0.1000000000000000055511151231257827…</span> — the impostor is real",
     "What gets <b>printed</b> is a choice. Modern languages compute the <b>shortest decimal string that would decode back to exactly the same stored bits</b> — and “0.1” is that string. The terminal is being <i>polite</i>, not honest",
     "The mask slips the moment arithmetic happens: <span class='mono'>0.1 + 0.2</span> → <span class='mono'>0.30000000000000004</span>, because the sum's bits are <i>not</i> 0.3's bits — so the shortest honest string is the ugly one",
     "Interrogate directly: <span class='mono'>format(0.1, '.20f')</span> → <span class='mono'>0.10000000000000000555</span>"),
  html("div",'<div class="note">Python floats are 64-bit (1 sign + 11 exponent + 52 fraction — same anatomy as FP32, bigger costume, same disease). Lesson for the week: <b>even what a terminal prints is a representation choice</b> — one more reader, one more convention.</div>'))},

{title:"How much number do you actually need?", body:()=> e(F,null,
  e("div",{className:"quote"},"32 bits per number. Says who?",
    e("small",null,"Your bank disagrees with your video game, and both disagree with an AI chip. Representation is an engineering choice — range vs precision vs speed vs energy. This week's PAGAL column follows that question to its 2026 frontier: the AI industry now runs neural networks on numbers just FOUR bits wide. How? Read the column — the answer reuses everything on this deck.")))},

{title:"This week", body:()=> e(F,null,
  li("<b>Practice:</b> convert 100, 255, and your roll number to binary and hex; write −77 in 8-bit two's complement; decode <span class='mono'>0 10000010 01000000000000000000000</span>",
     "<b>Lab:</b> expressions and number-system practice — bring these conversions warm",
     "<b>Read:</b> the Computing Machine slides (Lec 3) on the course site, and the week's PAGAL column",
     "<b>Ask, always:</b> what is the GIVEN? what is the ENSURES? — yes, even for conversions"),
  html("div",'<div class="note">Next week: from numbers to programs — the anatomy of a C program, and what a compiler actually does.</div>'))},

];

/* ---------- deck engine ---------- */
function Deck(){
  const [i,setI] = React.useState(()=>{
    const n=parseInt(location.hash.slice(1)); return Number.isInteger(n)&&n>=0&&n<SLIDES.length? n:0; });
  const go = React.useCallback(d=>{
    setI(cur=>{ const n=Math.min(SLIDES.length-1, Math.max(0, cur+d)); location.hash="#"+n; return n; });
  },[]);
  React.useEffect(()=>{
    const k=ev=>{ if(["ArrowRight","PageDown"," "].includes(ev.key)) go(1);
                  else if(["ArrowLeft","PageUp"].includes(ev.key)) go(-1);
                  else if(ev.key==="Home"){ setI(0); location.hash="#0"; } };
    window.addEventListener("keydown",k); return ()=>window.removeEventListener("keydown",k);
  },[go]);
  const s=SLIDES[i];
  return e("div",{className:"deck"},
    e("div",{className:"clickzone",style:{left:0},onClick:()=>go(-1)}),
    e("div",{className:"clickzone",style:{right:0},onClick:()=>go(1)}),
    e("div",{className:"slide "+(s.cls||"")},
      s.title? e("h2",null,s.title):null,
      s.body()),
    e("div",{className:"bar"}, e("div",{style:{width:((i+1)/SLIDES.length*100)+"%"}})),
    e("div",{className:"foot"},
      e("span",null, e("b",null,"CS-1-01 (MO)")," · Deck 03 · Number Systems"),
      e("span",{className:"navhint"},"← → to navigate"),
      e("span",null, (i+1)+" / "+SLIDES.length)));
}
ReactDOM.createRoot(document.getElementById("root")).render(e(Deck));
</script>
</body>
</html>
